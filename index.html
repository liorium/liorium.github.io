<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Liorium Chrome 확장 프로그램의 개인정보처리방침 안내"
    />
    <link rel="canonical" href="https://liorium.github.io/" />
    <title>개인정보처리방침 안내 · Liorium</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f7fb;
        color: #202a3b;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
          sans-serif;
        line-height: 1.75;
        word-break: keep-all;
      }
      main {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: 72px 0;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        line-height: 1.35;
        letter-spacing: -0.04em;
      }
      .description {
        margin: 16px 0 32px;
        color: #64748b;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid #e3e8f0;
        border-radius: 12px;
        background: #fff;
        overflow: hidden;
      }
      li + li {
        border-top: 1px solid #e3e8f0;
      }
      a {
        display: block;
        padding: 22px 24px;
        color: #5264e8;
        text-decoration: none;
      }
      a:hover {
        background: #eef1ff;
      }
      a:focus-visible {
        outline: 3px solid #5264e8;
        outline-offset: -3px;
      }
      strong {
        display: block;
        font-size: 1.05rem;
      }
      a span {
        display: block;
        margin-top: 4px;
        color: #64748b;
        font-size: 0.9rem;
      }
      footer {
        margin-top: 24px;
        color: #64748b;
        font-size: 0.85rem;
      }
      @media (max-width: 520px) {
        main {
          padding-top: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>개인정보처리방침 안내</h1>
      <p class="description">
        개인정보처리방침을 확인할 확장 프로그램을 선택해 주세요.
      </p>
      <nav aria-label="확장 프로그램 개인정보처리방침">
        <ul>
          <li>
            <a href="google-translate-sidebar-extension/"
              ><strong>Google 번역 사이드바</strong
              ><span>개인정보처리방침 보기</span></a
            >
          </li>
          <li>
            <a href="righthold-extension/"
              ><strong>RightHold — 마우스 제스처</strong
              ><span>개인정보처리방침 보기</span></a
            >
          </li>
        </ul>
      </nav>
      <footer>© 2026 Liorium.</footer>
    </main>
  </body>
</html>
